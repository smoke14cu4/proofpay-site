name: Scheduled Curl Request

on:
  schedule:
    # Runs at minute 0 of every hour (e.g., 1:00, 2:00, etc.)
    # Format: minute hour day month day-of-week
    #- cron: '0 * * * *'
    
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  
  # Optional: Allows you to trigger the workflow manually from the GitHub UI
  workflow_dispatch: 

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the endpoint
        run: |
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" https://task-verifier.onrender.com/api/healthz
